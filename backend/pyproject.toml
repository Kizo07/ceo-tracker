# Tooling configuration for the CEO Tracker backend.
# NOTE: intentionally no [project]/[build-system]; deps live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
# Sane default gate: E4 (imports), E7 (statements), E9 (runtime), F (pyflakes).
# Broader rule sets (I/UP/B) are deferred: B008 false-positives on FastAPI
# Depends()/Query() defaults, and UP006/UP045 are noisy modernizations.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# FastAPI routers are imported after the app is constructed.
"app/main.py" = ["E402"]
