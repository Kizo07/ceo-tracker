version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ceo_tracker_postgres
    environment:
      POSTGRES_USER: ceo_tracker
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ceo_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ceo_tracker_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceo_tracker_backend
    environment:
      DATABASE_URL: postgresql://ceo_tracker:password@postgres:5432/ceo_tracker
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceo_tracker_celery_worker
    environment:
      DATABASE_URL: postgresql://ceo_tracker:password@postgres:5432/ceo_tracker
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app:celery worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceo_tracker_celery_beat
    environment:
      DATABASE_URL: postgresql://ceo_tracker:password@postgres:5432/ceo_tracker
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app:celery beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ceo_tracker_frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
