name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest + openapi drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Install torch from the CPU index first so we don't pull the ~2GB CUDA
      # wheel. `2.1.1+cpu` satisfies the `torch==2.1.1` pin in requirements.txt.
      - name: Install torch (CPU)
        run: pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Standalone import smoke — fails fast with an unmasked traceback if the
      # app or models can't be imported (catches missing files / bad imports
      # before pytest's conftest masking obscures the cause).
      - name: Import smoke
        run: python -c "from app.main import app; print('app import OK')"

      - name: Pytest
        run: pytest

      # Regenerate the OpenAPI snapshot; fail if it differs from the committed
      # one (i.e. the contract changed without updating openapi.json).
      - name: OpenAPI snapshot drift check
        run: |
          python scripts/export_openapi.py --out ../openapi.json
          cd .. && git diff --exit-code -- openapi.json

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (codegen drift + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Regenerate TS types from the committed openapi.json; fail if the
      # generated file drifted from what's committed.
      - name: Generated types drift check
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.generated.ts

      - run: npm run lint
      - run: npm run build

  # ---------------------------------------------------------------------------
  specs:
    name: Specs (YAML validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate specs/*.yaml parse
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          ok = True
          for f in sorted(glob.glob("specs/*.yaml")):
              try:
                  yaml.safe_load(open(f))
                  print(f"OK   {f}")
              except Exception as e:
                  ok = False
                  print(f"FAIL {f}: {e}")
          sys.exit(0 if ok else 1)
          EOF
